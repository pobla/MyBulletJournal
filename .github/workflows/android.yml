name: APK debug

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests unitarios y APK debug
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/cuaderno-de-bolsillo-${{ github.run_number }}.apk"

      - name: Subir artefacto
        uses: actions/upload-artifact@v5
        with:
          name: cuaderno-de-bolsillo-debug-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      # Release "debug-latest": enlace fijo y fácil de descargar desde el móvil.
      - name: Publicar en la release debug-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest out/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Cuaderno de bolsillo · debug #${{ github.run_number }}" \
            --notes "APK debug de la rama \`${{ github.ref_name }}\`, commit ${GITHUB_SHA::7}. Descarga el .apk de abajo e instálalo."
